# Partners: the clubs, schools, companies and organizations ESRA works
# with. Each one appears on the home page's partner wall and on /members.
#
#   kind   club (default) | school | company | organization
#   logo   file name under src/assets/logos — any format, any colours.
#          The site redraws it in its own ink, so logos never clash with
#          the page or each other. If one comes out as a negative, add
#          `logoInvert: true`.
#
# Migrated from the old site's content/team/partners.yaml, with the CRT
# URL upgraded to https (it was http) and the Rutgers Dynamics entry
# pointed at the club's real site rather than its LinkedIn page.
#
# RMC and UC Berkeley have no logo asset yet — the old site pointed both
# at ESRA's own mark, which misrepresented them, so the field is simply
# omitted and the wall shows a lettered mark until a file is added.

- id: crt
  name: Caltech Robotics Team
  abbr: CRT
  school: Caltech
  location: Pasadena, CA
  url: https://crt.caltech.edu/
  logo: crt.png

- id: rmc
  name: Robotic Manipulation Club
  abbr: RMC
  school: Caltech
  location: Pasadena, CA
  url: https://rmc.caltech.edu/

- id: curc
  name: Columbia University Robotics Club
  abbr: CURC
  school: Columbia University
  location: New York, NY
  url: https://www.columbiarobotics.club/
  logo: curc.svg

- id: rutgers-dynamics
  name: Rutgers Dynamics
  school: Rutgers University
  location: New Brunswick, NJ
  url: https://www.rudynamics.org/
  logo: rutgers-dynamics.png

- id: berkeley
  name: UC Berkeley
  kind: school
  school: University of California, Berkeley
  location: Berkeley, CA
  url: https://www.berkeley.edu/
