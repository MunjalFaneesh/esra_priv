title: Leg Test Stand — Prototype BOM
subject: Early prototype test stand and three quasi-direct-drive actuators
updated: 2026-07-19
currency: USD

# Transcribed from the working spreadsheet. Two things are deliberately
# NOT computed here:
#
#  1. The sheet's "Cost" column reads $0.00 on nearly every row while
#     "Per Unit" carries real prices, and a lone "$49.55" appears under
#     "Cost Left". Those columns are ambiguous without their formulas, so
#     no project total is asserted. The component sums only the lines
#     where unitPrice x unitQty is unambiguous, and labels it as such.
#
#  2. Rows with a blank quantity in the source are left blank rather than
#     assumed to be 1.
#
# Quantities are free text because the source uses expressions like
# "42 x 3 = 126" that carry more meaning than a bare number.
notes: >-
  Quantities are sized for three motors. Printed parts were run on a Bambu
  X1C in PETG. Cost columns in the source spreadsheet were ambiguous, so
  only per-unit prices are reproduced.

