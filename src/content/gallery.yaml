# Gallery items.
#
# Migrated from the old site's content/gallery.yaml. Credits are preserved
# verbatim — attribution is a real editorial convention here, and several
# of these parts were designed by people outside the core team.
#
# `src` is a path relative to src/assets/ for images, or an absolute
# /media/ path for video (video is served as-is, not optimised).
#
# To add an item: copy a block, drop the file in src/assets/gallery/,
# and run `pnpm optimize:assets`.

