name: Refresh (deploy-hook — dormant)

# Keeps the static site current by pinging a Vercel Deploy Hook, which
# triggers Vercel's OWN git-based build.
#
# DORMANT FOR NOW. A deploy hook only works once Vercel is connected to
# this repository — and that connection is exactly what the Hobby plan
# blocks for a private org repo. While that is the case, deploy.yml does
# the scheduled rebuild instead, by building here and uploading with a
# token. This file fires on nothing but the manual button so the two
# cannot both deploy at once.
#
# TO REVIVE: once the repo is public or the account is on Pro, connect it
# in the Vercel dashboard, create a Deploy Hook (Settings -> Git -> Deploy
# Hooks), store it as VERCEL_DEPLOY_HOOK, restore the schedule and
# repository_dispatch triggers below, and delete deploy.yml.

on:
  # schedule:
  #   - cron: '0 */6 * * *'
  # repository_dispatch:
  #   types: [refresh-site, org-push]

  # Manual button in the Actions tab.
  workflow_dispatch:

jobs:
  redeploy:
    name: Trigger Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check hook is configured
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set."
            echo "Create a Deploy Hook in the Vercel project (Settings -> Git ->"
            echo "Deploy Hooks), then add the URL as a repository secret named"
            echo "VERCEL_DEPLOY_HOOK."
            exit 1
          fi

      - name: Request deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          status=$(curl -sS -X POST "$HOOK" -o response.json -w '%{http_code}')
          echo "Vercel responded $status"
          cat response.json
          # Any 2xx means the deploy was queued.
          case "$status" in
            2*) exit 0 ;;
            *) echo "::error::Deploy hook failed with HTTP $status"; exit 1 ;;
          esac
